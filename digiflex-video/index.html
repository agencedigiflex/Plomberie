<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Digiflex — l'agence au Canard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family: "Poppins"; font-style: italic; font-weight: 800; src: url(fonts/poppins-latin-800-italic.woff2) format("woff2"); }
  @font-face { font-family: "Poppins"; font-style: normal; font-weight: 700; src: url(fonts/poppins-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Poppins"; font-style: normal; font-weight: 600; src: url(fonts/poppins-latin-600-normal.woff2) format("woff2"); }

  :root {
    --pink: #D2117A;
    --pink-dark: #A90C61;
    --pink-light: #E8559F;
    --yellow: #FFD84D;
    --ink: #131017;
    --white: #FFFFFF;
    --grey: #EDE7EC;
  }
  html, body { margin: 0; background: #0b0a0d; }
  body.preview { display: grid; place-items: center; min-height: 100vh; }
  #frame { width: 1920px; height: 1080px; position: relative; }
  body.preview #frame { transform-origin: top left; }
  #stage {
    position: absolute; inset: 0; overflow: hidden;
    background: var(--pink); font-family: "Poppins", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  .bg { position: absolute; inset: 0; }
  .abs { position: absolute; }

  /* typo : Poppins ExtraBold Italique, capitales serrées (cf. bannière) */
  .t {
    position: absolute; white-space: nowrap;
    font-style: italic; font-weight: 800; text-transform: uppercase;
    line-height: .98; letter-spacing: -.012em; color: var(--white);
  }
  .t.center { left: 0 !important; width: 1920px; text-align: center; }
  .ln { display: block; overflow: hidden; padding: .2em .2em .1em; margin: -.2em -.2em -.1em; }
  .ln > .in { display: inline-block; will-change: transform; }
  .hl { position: relative; display: inline-block; color: var(--ink); padding: 0 .12em; margin: 0 -.04em; z-index: 0; }
  .hl > i { position: absolute; left: 0; right: 0; top: .1em; bottom: .02em; background: var(--yellow); z-index: -1; transform-origin: 0 50%; }
  .hl.pink { color: var(--white); } .hl.pink > i { background: var(--pink); }
  .hl.ink { color: var(--yellow); } .hl.ink > i { background: var(--ink); }
  .hl.white { color: var(--pink); } .hl.white > i { background: var(--white); }
  .ink { color: var(--ink); } .yel { color: var(--yellow); } .pk { color: var(--pink); }

  .label { position: absolute; font-weight: 700; font-style: normal; text-transform: uppercase; letter-spacing: .08em; }

  /* stickers / étiquettes */
  .tag {
    position: absolute; white-space: nowrap;
    font-style: italic; font-weight: 800; text-transform: uppercase; letter-spacing: -.01em;
    padding: .18em .5em .14em; border-radius: .5em; line-height: 1;
  }

  /* canard */
  .duck { position: absolute; }
  .duck .bob { position: absolute; inset: 0; }
  .duck svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .duck.flip svg { transform: scaleX(-1); }

  /* fenêtre de navigateur */
  .browser { position: absolute; background: #fff; border-radius: 22px; overflow: hidden; }
  .b-bar { position: absolute; left: 0; right: 0; top: 0; height: 54px; background: #F4EFF3; display: flex; align-items: center; gap: 10px; padding: 0 22px; }
  .b-bar i { width: 16px; height: 16px; border-radius: 50%; background: #d8cfd6; flex: none; }
  .b-bar i:nth-child(1) { background: var(--pink); } .b-bar i:nth-child(2) { background: var(--yellow); }
  .b-url { margin-left: 16px; flex: 1; height: 30px; border-radius: 15px; background: #fff; font: 600 15px/30px "Poppins"; color: #9a8f98; padding: 0 16px; }
  .b-body { position: absolute; left: 0; right: 0; top: 54px; bottom: 0; overflow: hidden; }
  .bx { position: absolute; border-radius: 10px; }

  .bubble { position: absolute; }
  .wipe { position: absolute; top: -200px; left: 0; width: 2800px; height: 1480px; transform: skewX(-14deg); z-index: 50; }
  svg.layer { position: absolute; left: 0; top: 0; overflow: visible; }

  /* aperçu dans le navigateur */
  #ui { display: none; }
  body.preview #ui { display: flex; gap: 12px; align-items: center; position: fixed; left: 16px; right: 16px; bottom: 16px; font: 600 14px "Poppins", sans-serif; color: #fff; }
  #ui button { font: inherit; background: var(--pink); color: #fff; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  #ui input { flex: 1; accent-color: var(--yellow); }
</style>
</head>
<body>
<div id="frame"><div id="stage"></div></div>
<div id="ui"><button id="play">▶ Lecture</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="clock">0.00</span></div>
<script src="vendor/gsap.min.js"></script>
<script src="timeline.js"></script>
<script src="motion.js"></script>
</body>
</html>
